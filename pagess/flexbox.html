<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>

     <style>
          .container{
               height:500px;
               width: 100%;
               background-color: aquamarine;
               display: flex;
               flex-direction: row;
               justify-content: space-around;
               align-items:center;
               gap: 15px;
               flex-wrap: wrap;
                   }

                   .items{
                    background-color: brown;
                    height: 150px;
                    width: 200px;
                   }


                   .grid{
                    height: 400px;
                    width: 80%;
                    background-color: chocolate;
                    display: grid;
                    grid-template-columns:repeat(3, 1fr);
                    gap: 20px;
                   }

                   .grid-items{
                    background-color: yellow;
                   }

                   .three{
                    grid-column: 2/5;
                    grid-row: 1/3;
                    background-color: red;
                   }
.five{
     grid-column: 2/5;
     grid-row: 3/6;
     background-color: rgb(162, 225, 14);
}

     </style>
</head>
<body>
     

     <div class="container">
          <div class="items">one</div>
          <div class="items">Two</div>
          <div class="items">Three</div>
          <div class="items">four</div>
          <div class="items">five</div>
           <div class="items">four</div>
          <div class="items">five</div>
     </div>



        <div class="grid">
          <div class="grid-items">one</div>
          <div class="grid-items">Two</div>
          <div class="grid-items three">Three</div>
          <div class="grid-items">four</div>
          <div class="grid-items five">five</div>
           <div class="grid-items">four</div>
          <div class="grid-items">five</div>
     </div>
</body>
</html>
