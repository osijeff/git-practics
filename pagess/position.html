     <style>
          body{
               background-color: #B4f4f4;
               /* display: flex; */
      
          }

         .card{
          position: relative;
          width: 300px;
          background: white;
          border-radius: 12px;
          overflow: hidden;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

         } 

         .badge{
          position: absolute;
          top: 10px;
          left: 10px;
          background-color: rgb(228, 8, 8);
          color: white;
          padding: 5px 10px;
          font-size: 12px;
         }

         .favorite{
          position: absolute;
          top: 10px;
          right: 10px;
          background-color: white;
          width: 35px;
          height: 35px;
          border-radius: 50%;
          display: flex;
          justify-content: center;
          align-items: center;
          cursor: pointer;
         }
/* ######################################### */
         .card > img{
          width: 100%;
         }
         .content{
          padding: 15px;
         }
         .price{
          font-size: 24px;
          font-weight: bold;
          color: green;
         }
         .btn{
          width: 100%;
          padding: 12px;
          border : none;
          color: white;
          background: #0078d7;
          cursor: pointer;
         }
.chat-btn{

}
